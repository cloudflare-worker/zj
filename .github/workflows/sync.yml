name: 同步代码
on:
  workflow_dispatch:
jobs:
  Start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth=1 https://github.com/1345695/edcloudwasm.git /tmp/src
          sed -i '/^# pages中环境/,/^cpu_ms = 300000$/d' /tmp/src/wrangler.toml
          rsync -av --exclude='.git' /tmp/src/ .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Sync edcloudwasm"
          git push
