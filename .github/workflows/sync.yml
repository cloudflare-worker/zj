name: 更新代码
on:
  workflow_dispatch:
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth=1 https://github.com/1345695/edcloudwasm.git /tmp/src
          sed -i 's/^name = .*/name = "zj"/' /tmp/src/wrangler.toml
          sed -i 's/^UUID = .*/UUID = "11112222-3333-4444-aaaa-bbbbccccdddd"/' /tmp/src/wrangler.toml
          sed -i 's/^S5HTTPUSER = .*/S5HTTPUSER = "666"/' /tmp/src/wrangler.toml
          sed -i 's/^S5HTTPPASS = .*/S5HTTPPASS = "666"/' /tmp/src/wrangler.toml
          sed -i '/^cpu_ms =/d' /tmp/src/wrangler.toml
          rsync -av --exclude='.git' /tmp/src/ .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$(date +%F)"
          git push
